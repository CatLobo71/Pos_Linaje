<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Linaje del Sabor</title>
<link rel="icon" href="data:,">
<style>
:root{--pri:#8B0000;--acc:#F5B700;--bg:#faf6f0;--card:#fff;--ink:#222;--mut:#6b6b6b;--ok:#1e8a4c;--bad:#c0392b;--line:#e8e1d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{background:var(--pri);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;letter-spacing:.3px}
header .sub{font-size:13px;opacity:.92;margin-top:2px}
.status{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.status.open{background:#d4f5e0;color:#0c5b2c}.status.closed{background:#ffe3e0;color:#8a1f12}
.notice{margin:10px 12px 0;padding:10px 12px;background:#fff7d6;border:1px solid #f0dc8a;border-radius:10px;font-size:14px}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 0 12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.prod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;font:inherit;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.prod b{font-size:15px;line-height:1.2}.prod span{color:var(--pri);font-weight:800}.prod small{color:var(--mut);font-size:12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar button{width:100%;max-width:760px;margin:0 auto;display:flex;justify-content:space-between;background:var(--pri);color:#fff;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:800}
.bar button:disabled{background:#bbb}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px;font-size:19px}
label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 4px;color:#444}
input[type=text],input[type=tel],input[type=number],select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #cfc7b8;border-radius:10px;background:#fff}
textarea{min-height:60px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button,.opt{flex:1;min-width:120px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 10px;font:inherit;font-weight:700;text-align:center}
.seg button.on,.opt.on{border-color:var(--pri);background:#fff1f0;color:var(--pri)}
.hint{font-size:13px;color:var(--mut);margin-top:4px}
.row{display:flex;gap:10px;align-items:center}.sp{flex:1}
.pri{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;width:100%}
.pri:disabled{background:#bbb}
.ghost{background:#fff;border:1px solid #bbb;border-radius:12px;padding:12px 14px;font-weight:700;font:inherit}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:40px;height:40px;border-radius:50%;border:1px solid #bbb;background:#fff;font-size:22px;font-weight:700}
.line{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .nm{flex:1;font-weight:700}.line small{display:block;font-weight:400;color:var(--mut)}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.tot.big{font-size:21px;font-weight:900;color:var(--pri);border-top:2px solid var(--pri);margin-top:6px;padding-top:10px}
.box{background:#f6f2ea;border-radius:12px;padding:12px;font-size:14px;margin-top:8px}
.err{color:var(--bad);font-size:13px;font-weight:700;margin-top:6px}
.empty{text-align:center;color:var(--mut);padding:26px 8px}
.chipsel{display:flex;flex-wrap:wrap;gap:8px}
.chipsel button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 13px;font:inherit;font-size:14px}
.chipsel button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:16px}
</style>
</head>
<body>
<header><div class="wrap" style="padding:0"><h1 id="h-name"></h1><div class="sub" id="h-sub"></div><span class="status" id="h-status"></span></div></header>
<div class="wrap">
  <div id="notice" class="notice" style="display:none"></div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <footer>Precios con IVA incluido · Pedido a través de WhatsApp</footer>
</div>
<div class="bar"><button id="cart-btn" disabled><span id="cart-n">Tu pedido está vacío</span><span id="cart-t"></span></button></div>
<div class="ov" id="ov-pick"><div class="sheet" id="pick"></div></div>
<div class="ov" id="ov-cart"><div class="sheet" id="cart"></div></div>
<div class="ov" id="ov-done"><div class="sheet" id="done"></div></div>

<script>
"use strict";
const CATALOG = {"categories":[{"id":"all","name":"Todos los Productos"},{"id":"bebidas","name":"Bebidas"},{"id":"burritos","name":"Burritos"},{"id":"gorditas","name":"Gorditas"},{"id":"otros","name":"Otros"},{"id":"platos","name":"Platos de Guisado"},{"id":"quesadillas","name":"Quesadillas"},{"id":"tacos","name":"Tacos"},{"id":"tortillas","name":"Tortillas"},{"id":"volcanes","name":"Volcanes"},{"id":"postres","name":"Postres"}],"stews":["BISTEC EN PASILLA","CARNE DE PUERCO","CHAMPIÑONES","CHORIZO","DESHEBRADA","DURO EN SALSA VERDE","FRIJOLES","HUEVO","MOLE CON POLLO","NOPALES","PAPAS","PICADILLO","PRENSADO","RAJAS CON CREMA"],"flavors":["AMERICANO","DE OLLA","HORCHATA","JAMAICA","NATURAL","NORMAL","SIN AZUCAR","TAMARINDO","MANZANILLA","LIMÓN","HIERBABUENA"],"products":[{"id":101,"name":"AGUAS FRESCAS LITRO","category":"bebidas","requiresStew":false,"requiresFlavor":true,"flavorOptions":["HORCHATA","JAMAICA","TAMARINDO"],"stewGroups":[],"variants":[{"size":"LITRO","price":35}]},{"id":102,"name":"AGUAS FRESCAS MEDIO LITRO","category":"bebidas","requiresStew":false,"requiresFlavor":true,"flavorOptions":["HORCHATA","JAMAICA","TAMARINDO"],"stewGroups":[],"variants":[{"size":"MEDIO LITRO","price":25}]},{"id":103,"name":"BURRITO","category":"burritos","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":32}]},{"id":104,"name":"CAFÉ","category":"bebidas","requiresStew":false,"requiresFlavor":true,"flavorOptions":["DE OLLA","AMERICANO"],"stewGroups":[],"variants":[{"size":"300 ML","price":30}]},{"id":105,"name":"CAFÉ REFIL","category":"bebidas","requiresStew":false,"requiresFlavor":true,"flavorOptions":["DE OLLA","AMERICANO"],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":40}]},{"id":106,"name":"CHALUPITA","category":"otros","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":35}]},{"id":107,"name":"AGUA NATURAL (CIEL O BONAFONT)","category":"bebidas","requiresStew":false,"requiresFlavor":true,"flavorOptions":["NATURAL"],"stewGroups":[],"variants":[{"size":"600 ML","price":20}]},{"id":108,"name":"GORDITA","category":"gorditas","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":30}]},{"id":109,"name":"GORDITA C/QUESO","category":"gorditas","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":32}]},{"id":110,"name":"GORDITA FRITA","category":"gorditas","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":32}]},{"id":111,"name":"OTROS","category":"otros","requiresStew":false,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":10}]},{"id":112,"name":"PLATO 1 GUISADO","category":"platos","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":60}]},{"id":113,"name":"PLATO 2 GUISADOS","category":"platos","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":80}]},{"id":114,"name":"PLATO 3 GUISADOS","category":"platos","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":100}]},{"id":115,"name":"PLATO GUISADO PEQUEÑO","category":"platos","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":35}]},{"id":116,"name":"QUESADILLAS COMAL (Guisado y Guarnición frijol o nopal))","category":"quesadillas","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[{"label":"Guisado","min":1,"max":1,"choices":[]},{"label":"Guarnición","min":0,"max":1,"choices":["CHAMPIÑONES","FRIJOLES","HUEVO","NOPALES","PAPAS","RAJAS CON CREMA"]}],"variants":[{"size":"ESTÁNDAR","price":30}]},{"id":117,"name":"QUESADILLA COMBINADA (2 Guisados y Guarnición (frijol o nopal))","category":"quesadillas","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[{"label":"Guisados","min":0,"max":2,"choices":["BISTEC EN PASILLA","CARNE DE PUERCO","CHAMPIÑONES","CHORIZO","DESHEBRADA","DURO EN SALSA VERDE","HUEVO","MOLE CON POLLO","PAPAS","PICADILLO","PRENSADO","RAJAS CON CREMA"]},{"label":"Guarnición","min":0,"max":2,"choices":["FRIJOLES","NOPALES"]}],"variants":[{"size":"ESTÁNDAR","price":35}]},{"id":118,"name":"QUESADILLAS COMAL (Doble Tortilla y 2 Guisados y Guarnición))","category":"quesadillas","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":38}]},{"id":119,"name":"REFRESCOS CHICOS","category":"bebidas","requiresStew":false,"requiresFlavor":true,"flavorOptions":["NORMAL","SIN AZUCAR"],"stewGroups":[],"variants":[{"size":"330 ML","price":20}]},{"id":120,"name":"REFRESCOS GRANDES","category":"bebidas","requiresStew":false,"requiresFlavor":true,"flavorOptions":["NORMAL","SIN AZUCAR"],"stewGroups":[],"variants":[{"size":"600 ML","price":32}]},{"id":121,"name":"TACO (Guisado y Guarnición frijol o nopal))","category":"tacos","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":30}]},{"id":122,"name":"TACO (Doble Tortilla y 2 Guisados y Guarnición))","category":"tacos","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":38}]},{"id":123,"name":"TORTILLA","category":"tortillas","requiresStew":false,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":5}]},{"id":124,"name":"VASO DESHECHABLE","category":"otros","requiresStew":false,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":5}]},{"id":125,"name":"VOLCAN","category":"volcanes","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":55}]},{"id":126,"name":"Flan casero","category":"postres","requiresStew":false,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":15}]},{"id":127,"name":"QUESADILLAS FRITA","category":"quesadillas","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":32}]},{"id":128,"name":"TACO COMBINADO (2 Guisados y Guarnición (frijol o nopal))","category":"tacos","requiresStew":true,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":35}]},{"id":129,"name":"TÉ","category":"bebidas","requiresStew":false,"requiresFlavor":true,"flavorOptions":["MANZANILLA","LIMÓN","HIERBABUENA"],"stewGroups":[],"variants":[{"size":"300 ML","price":25}]},{"id":130,"name":"QUESADILLA DOBLE QUESO SIN GUISADO","category":"quesadillas","requiresStew":false,"requiresFlavor":false,"flavorOptions":[],"stewGroups":[],"variants":[{"size":"ESTÁNDAR","price":30}]}]};
const CFG = {"name":"Linaje del Sabor","whatsapp":"4771580966","open":"09:00","lastOrder":"12:30","close":"13:00","days":[3,4,5,6,0],"slot":30,"lead":30,"eta":"30-45 min","notice":"","bank":{"bank":"Banamex","holder":"Ana Catarina Ávila Cano","clabe":""},"cardNote":"","allowLink":true,"tariffs":[{"upTo":2,"cost":20},{"upTo":3,"cost":30},{"upTo":5,"cost":45},{"upTo":8,"cost":60}],"maxKm":8,"minOrder":0,"freeFrom":0,"zones":[{"name":"Amberes Residencial","km":4.5},{"name":"Real Providencia I","km":2},{"name":"Real Providencia II","km":2},{"name":"Brisas del Lago","km":6}],"origin":{"lat":21.131405891428326,"lng":-101.65657124628952},"roadFactor":1.3,"hidden":[]};
const KEY = 'linaje_online_cart_v1';
const DOW = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + (Number(n) || 0).toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const toMin = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
const fmtT = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);

function stewGroupsOf(p, allStews) {
  if (!p.requiresStew) return [];
  if (Array.isArray(p.stewGroups) && p.stewGroups.length) return p.stewGroups.map(g => { const mx = Math.max(1, +g.max || 1), mn = Math.min(mx, Math.max(0, g.min == null ? 1 : +g.min)); return { label: g.label || 'Guisado', min: mn, max: mx, choices: (g.choices && g.choices.length ? g.choices : allStews) }; });
  return [{ label: 'Guisados', min: 1, max: 4, choices: allStews }];
}
function flavorsOf(p, all) { return Array.isArray(p.flavorOptions) && p.flavorOptions.length ? p.flavorOptions : all; }
let cart = [];
let catFilter = 'all';
let pick = null;
let co = { mode: 'REC', name: '', tel: '', street: '', colonia: '', ref: '', note: '', when: '', pay: '', cashWith: '', link: false, geo: null, km: null };

try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) { if (Array.isArray(s.cart)) cart = s.cart; if (s.co) co = Object.assign(co, s.co); } } catch (e) {}
function persist() { try { localStorage.setItem(KEY, JSON.stringify({ cart, co })); } catch (e) {} }

/* ---------- Horario ---------- */
function serviceDay(d) { return CFG.days.includes(d.getDay()); }
function nowMin() { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); }
function isOpenNow() { const n = new Date(); return serviceDay(n) && nowMin() >= toMin(CFG.open) && nowMin() <= toMin(CFG.lastOrder); }
function daysText() {
  const order = [1, 2, 3, 4, 5, 6, 0], on = order.filter(d => CFG.days.includes(d));
  if (on.length === 7) return 'todos los días';
  const cap = s => s[0].toUpperCase() + s.slice(1);
  const runs = []; let cur = [];
  order.forEach(d => { if (CFG.days.includes(d)) cur.push(d); else { if (cur.length) runs.push(cur); cur = []; } }); if (cur.length) runs.push(cur);
  return runs.map(r => r.length > 2 ? cap(DOW[r[0]]) + ' a ' + DOW[r[r.length - 1]] : r.map(d => DOW[d]).join(' y ')).join(', ');
}
function slotsFor(day) { // day: Date
  const out = [], today = ymd(day) === ymd(new Date());
  if (!serviceDay(day)) return out;
  if (today) {
    const lead = nowMin() + (CFG.lead || 30);
    if (isOpenNow()) out.push({ v: ymd(day) + ' ASAP', t: 'Lo antes posible (' + CFG.eta + ')' });
    for (let m = toMin(CFG.open); m <= toMin(CFG.lastOrder); m += CFG.slot) if (m >= lead) out.push({ v: ymd(day) + ' ' + fmtT(m), t: 'Hoy a las ' + fmtT(m) });
  } else {
    const lbl = DOW[day.getDay()] + ' ' + day.getDate();
    for (let m = toMin(CFG.open); m <= toMin(CFG.lastOrder); m += CFG.slot) out.push({ v: ymd(day) + ' ' + fmtT(m), t: lbl[0].toUpperCase() + lbl.slice(1) + ' a las ' + fmtT(m) });
  }
  return out;
}
function allSlots() {
  const res = [], base = new Date(); base.setHours(12, 0, 0, 0);
  for (let i = 0; i < 8 && res.length < 40; i++) { const d = new Date(base); d.setDate(base.getDate() + i); slotsFor(d).forEach(s => res.push(s)); }
  return res;
}
function header() {
  $('h-name').textContent = CFG.name;
  document.title = 'Pide en línea · ' + CFG.name;
  $('h-sub').textContent = 'Pedidos ' + daysText() + ' de ' + CFG.open + ' a ' + CFG.close + ' h';
  const st = $('h-status'), open = isOpenNow();
  st.className = 'status ' + (open ? 'open' : 'closed');
  st.textContent = open ? 'Abierto ahora · pedidos hasta las ' + CFG.lastOrder : 'Cerrado ahora · puedes programar tu pedido';
  if (CFG.notice) { $('notice').style.display = 'block'; $('notice').textContent = CFG.notice; }
}

/* ---------- Menú ---------- */
const visibleProducts = () => CATALOG.products.filter(p => !(CFG.hidden || []).includes(p.id));
function renderMenu() {
  const prods = visibleProducts();
  const cats = CATALOG.categories.filter(c => c.id === 'all' || prods.some(p => p.category === c.id));
  $('chips').innerHTML = cats.map(c => '<button class="chip' + (c.id === catFilter ? ' on' : '') + '" data-c="' + esc(c.id) + '">' + esc(c.id === 'all' ? 'Todo' : c.name) + '</button>').join('');
  $('chips').querySelectorAll('button').forEach(b => b.onclick = () => { catFilter = b.dataset.c; renderMenu(); });
  $('grid').innerHTML = prods.filter(p => catFilter === 'all' || p.category === catFilter).map(p => {
    const min = Math.min(...p.variants.map(v => v.price));
    return '<button class="prod" data-id="' + p.id + '"><b>' + esc(p.name) + '</b><div><span>' + (p.variants.length > 1 ? 'desde ' : '') + money(min) + '</span>' +
      (p.requiresStew ? '<br><small>elige tu guisado</small>' : p.requiresFlavor ? '<br><small>elige sabor</small>' : '') + '</div></button>';
  }).join('') || '<div class="empty">Sin productos</div>';
  $('grid').querySelectorAll('.prod').forEach(b => b.onclick = () => openPick(+b.dataset.id));
}

/* ---------- Producto ---------- */
function openPick(id) {
  const p = CATALOG.products.find(x => x.id === id); if (!p) return;
  pick = { p, vi: 0, groups: stewGroupsOf(p, CATALOG.stews), sel: [], flavor: null, qty: 1 }; pick.sel = pick.groups.map(() => []);
  renderPick(); $('ov-pick').classList.add('show');
}
function renderPick() {
  const c = pick, p = c.p;
  let h = '<h3>' + esc(p.name) + '</h3>';
  if (p.variants.length > 1) h += '<label class="f">Tamaño</label><div class="seg" id="pk-var">' + p.variants.map((v, i) => '<button data-i="' + i + '" class="' + (i === c.vi ? 'on' : '') + '">' + esc(v.size) + '<br>' + money(v.price) + '</button>').join('') + '</div>';
  c.groups.forEach((g, gi) => {
    h += '<label class="f">' + esc(g.label) + (g.max > 1 ? ' (elige hasta ' + g.max + ')' : ' (elige 1)') + (g.min ? ' *' : '') + '</label><div class="chipsel" data-g="' + gi + '">' + g.choices.map(s => { const n = c.sel[gi].filter(x => x === s).length; return '<button class="' + (n ? 'on' : '') + '" data-s="' + esc(s) + '">' + esc(s) + (n > 1 ? ' ×' + n : '') + '</button>'; }).join('') + '</div>';
    if (g.max > 1 && c.sel[gi].length) h += '<div class="hint">Elegidos: ' + c.sel[gi].map((s, i) => '<button class="ghost" style="padding:4px 10px;font-size:13px;margin:2px" data-g="' + gi + '" data-rm="' + i + '">' + esc(s) + ' ✕</button>').join('') + '</div>';
  });
  if (p.requiresFlavor) h += '<label class="f">Sabor</label><div class="chipsel" id="pk-fl">' + flavorsOf(p, CATALOG.flavors).map(f => '<button class="' + (c.flavor === f ? 'on' : '') + '" data-f="' + esc(f) + '">' + esc(f) + '</button>').join('') + '</div>';
  const need = c.groups.some((g, gi) => c.sel[gi].length < g.min) || (p.requiresFlavor && !c.flavor);
  h += '<div class="row" style="margin-top:16px"><div class="qty"><button id="pk-m">−</button><b id="pk-q" style="min-width:20px;text-align:center">' + c.qty + '</b><button id="pk-p">+</button></div><b class="sp" style="text-align:right;font-size:21px;color:var(--pri)">' + money(p.variants[c.vi].price * c.qty) + '</b></div>';
  h += '<div class="row" style="margin-top:12px"><button class="pri sp" id="pk-add"' + (need ? ' disabled' : '') + '>Agregar al pedido</button><button class="ghost" id="pk-x">Cancelar</button></div>';
  $('pick').innerHTML = h;
  const sh = $('pick');
  sh.querySelectorAll('#pk-var button').forEach(b => b.onclick = () => { c.vi = +b.dataset.i; renderPick(); });
  sh.querySelectorAll('.chipsel[data-g] button').forEach(b => b.onclick = () => { const gi = +b.parentNode.dataset.g, g = c.groups[gi], s = b.dataset.s;
    if (g.max === 1) c.sel[gi] = c.sel[gi][0] === s ? [] : [s]; else if (c.sel[gi].length < g.max) c.sel[gi].push(s); renderPick(); });
  sh.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { c.sel[+b.dataset.g].splice(+b.dataset.rm, 1); renderPick(); });
  sh.querySelectorAll('#pk-fl button').forEach(b => b.onclick = () => { c.flavor = b.dataset.f; renderPick(); });
  $('pk-m').onclick = () => { if (c.qty > 1) { c.qty--; renderPick(); } };
  $('pk-p').onclick = () => { c.qty++; renderPick(); };
  $('pk-x').onclick = () => $('ov-pick').classList.remove('show');
  $('pk-add').onclick = () => {
    const stews = [].concat(...c.sel), v = p.variants[c.vi], key = p.id + '_' + c.vi + '_' + stews.join('-') + '_' + (c.flavor || '');
    const ex = cart.find(i => i.key === key);
    if (ex) ex.qty += c.qty; else cart.push({ key, pid: p.id, vi: c.vi, name: p.name, size: v.size, cat: p.category, price: v.price, stews: stews, flavor: c.flavor || null, qty: c.qty });
    $('ov-pick').classList.remove('show'); persist(); renderBar();
  };
}

/* ---------- Carrito / totales ---------- */
const subtotal = () => cart.reduce((s, i) => s + i.price * i.qty, 0);
function renderBar() {
  const n = cart.reduce((s, i) => s + i.qty, 0);
  $('cart-btn').disabled = !n;
  $('cart-n').textContent = n ? 'Ver mi pedido (' + n + ')' : 'Tu pedido está vacío';
  $('cart-t').textContent = n ? money(subtotal()) : '';
}
function showSize(i) { return i.size && i.size !== 'ESTÁNDAR' && i.name.indexOf(i.size) === -1; }
function subLines(i) { const o = i.stews.slice(); if (i.flavor) o.push('Sabor: ' + i.flavor); return o; }

/* ---------- Envío ---------- */
function haversine(a, b) { const R = 6371, r = x => x * Math.PI / 180, dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng); const q = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(q)); }
function tariff(km) { const t = (CFG.tariffs || []).slice().sort((a, b) => a.upTo - b.upTo).find(x => km <= x.upTo); return t ? t.cost : null; }
function kmNow() {
  if (co.colonia && co.colonia !== '__otra') { const z = (CFG.zones || []).find(z => z.name === co.colonia); if (z) return { km: z.km, src: 'zona' }; }
  if (co.geo && CFG.origin) return { km: Math.round(haversine(CFG.origin, co.geo) * (CFG.roadFactor || 1.3) * 10) / 10, src: 'gps' };
  return null;
}
function delivery() { // → {fee, label, blocked, tbd}
  if (co.mode !== 'DOM') return { fee: 0, label: '', blocked: false, tbd: false };
  const k = kmNow();
  if (!k) return { fee: 0, label: 'Envío por confirmar', blocked: false, tbd: true };
  if (CFG.maxKm && k.km > CFG.maxKm) return { fee: 0, label: 'Fuera de zona', blocked: true, tbd: false, km: k.km };
  let fee = tariff(k.km);
  if (fee == null) return { fee: 0, label: 'Envío por confirmar', blocked: false, tbd: true, km: k.km };
  if (CFG.freeFrom && subtotal() >= CFG.freeFrom) return { fee: 0, label: 'Envío gratis', blocked: false, tbd: false, km: k.km };
  return { fee, label: 'Envío (' + (k.src === 'gps' ? '≈ ' : '') + k.km + ' km)', blocked: false, tbd: false, km: k.km };
}
const grand = () => subtotal() + delivery().fee;

/* ---------- Checkout ---------- */
function openCart() { renderCart(); $('ov-cart').classList.add('show'); }
function renderCart() {
  const d = delivery(), slots = allSlots();
  if (!slots.some(s => s.v === co.when)) co.when = slots.length ? slots[0].v : '';
  let h = '<h3>Tu pedido</h3>';
  h += cart.map((i, idx) => '<div class="line"><div class="nm">' + esc(i.name) + (showSize(i) ? ' · ' + esc(i.size) : '') + (subLines(i).length ? '<small>' + subLines(i).map(esc).join(' · ') + '</small>' : '') + '</div><div class="qty"><button data-a="m" data-i="' + idx + '">−</button><b>' + i.qty + '</b><button data-a="p" data-i="' + idx + '">+</button></div><b style="min-width:70px;text-align:right">' + money(i.price * i.qty) + '</b></div>').join('') || '<div class="empty">Tu pedido está vacío</div>';
  h += '<label class="f">¿Cómo lo quieres?</label><div class="seg" id="c-mode"><button data-m="REC" class="' + (co.mode === 'REC' ? 'on' : '') + '">🏪 Recoger en el local</button><button data-m="DOM" class="' + (co.mode === 'DOM' ? 'on' : '') + '">🛵 A domicilio</button></div>';
  h += '<label class="f">Tu nombre</label><input type="text" id="c-name" autocomplete="name" value="' + esc(co.name) + '">';
  h += '<label class="f">Teléfono / WhatsApp (10 dígitos)</label><input type="tel" id="c-tel" inputmode="numeric" maxlength="14" value="' + esc(co.tel) + '">';
  if (co.mode === 'DOM') {
    h += '<label class="f">Calle y número</label><input type="text" id="c-street" autocomplete="street-address" value="' + esc(co.street) + '">';
    if ((CFG.zones || []).length) {
      h += '<label class="f">Colonia</label><select id="c-col"><option value="">— Elige tu colonia —</option>' + CFG.zones.map(z => '<option' + (co.colonia === z.name ? ' selected' : '') + '>' + esc(z.name) + '</option>').join('') + '<option value="__otra"' + (co.colonia === '__otra' ? ' selected' : '') + '>Otra colonia (el envío se confirma por WhatsApp)</option></select>';
      if (co.colonia === '__otra') h += '<input type="text" id="c-col2" style="margin-top:8px" placeholder="Escribe tu colonia" value="' + esc(co.colonia2 || '') + '">';
    } else h += '<label class="f">Colonia</label><input type="text" id="c-col2" value="' + esc(co.colonia2 || '') + '">';
    h += '<label class="f">Referencias (color de casa, entre calles…)</label><input type="text" id="c-ref" value="' + esc(co.ref) + '">';
    h += '<div style="margin-top:8px"><button class="ghost" id="c-geo">📍 Usar mi ubicación (calcula el envío)</button>' + (co.geo ? ' <span class="hint">✓ ubicación compartida</span>' : '') + '</div>';
    h += '<div class="hint">Si compartes tu ubicación, nos ayuda a llegar con precisión' + (CFG.origin ? ' y estimar el costo de envío' : '') + '.</div>';
    const rows = (CFG.tariffs || []).slice().sort((a, b) => a.upTo - b.upTo).map((t, i, a) => (i ? 'de ' + a[i - 1].upTo + ' a ' + t.upTo : 'hasta ' + t.upTo) + ' km: ' + money(t.cost)).join(' · ');
    if (rows) h += '<div class="box">Costo de envío — ' + rows + (CFG.maxKm ? ' · cobertura hasta ' + CFG.maxKm + ' km' : '') + (CFG.freeFrom ? '. Envío gratis desde ' + money(CFG.freeFrom) + ' de compra' : '') + '</div>';
    if (d.blocked) h += '<div class="err">Por ahora no llegamos a esa zona (≈ ' + d.km + ' km). Escríbenos por WhatsApp y vemos opciones.</div>';
  }
  h += '<label class="f">¿Para cuándo?</label>';
  h += slots.length ? '<select id="c-when">' + slots.map(s => '<option value="' + s.v + '"' + (co.when === s.v ? ' selected' : '') + '>' + esc(s.t) + '</option>').join('') + '</select>' : '<div class="err">No hay horarios disponibles.</div>';
  h += '<label class="f">Forma de pago</label><div class="seg" id="c-pay"><button data-p="EFECTIVO" class="' + (co.pay === 'EFECTIVO' ? 'on' : '') + '">💵 Efectivo</button><button data-p="TRANSFERENCIA" class="' + (co.pay === 'TRANSFERENCIA' ? 'on' : '') + '">🏦 Transferencia</button><button data-p="TARJETA" class="' + (co.pay === 'TARJETA' ? 'on' : '') + '">💳 Tarjeta</button></div>';
  if (co.pay === 'EFECTIVO') h += '<label class="f">¿Con cuánto pagas? (para llevar cambio)</label><input type="number" id="c-cash" inputmode="decimal" min="0" value="' + esc(co.cashWith) + '">';
  if (co.pay === 'TRANSFERENCIA') h += '<div class="box"><b>Datos para transferir</b><br>' + (CFG.bank && CFG.bank.clabe ? esc(CFG.bank.bank || '') + '<br>' + esc(CFG.bank.holder || '') + '<br><b>' + esc(CFG.bank.clabe) + '</b> <button class="ghost" style="padding:4px 10px" id="c-copy">Copiar</button>' : 'Te enviamos los datos por WhatsApp.') + '<br><span class="hint">Después de transferir, envíanos tu comprobante por WhatsApp. Preparamos tu pedido al confirmar el pago.</span></div>';
  if (co.pay === 'TARJETA') h += '<div class="box">' + (co.mode === 'DOM' ? 'Pagas con tarjeta en la terminal cuando te lleguemos.' : 'Pagas con tarjeta en la terminal al recoger.') + (CFG.cardNote ? ' ' + esc(CFG.cardNote) : '') + (CFG.allowLink ? '<br><label style="display:block;margin-top:8px"><input type="checkbox" id="c-link"' + (co.link ? ' checked' : '') + '> Prefiero que me envíen un link de pago por WhatsApp</label>' : '') + '</div>';
  h += '<label class="f">Notas para tu pedido (opcional)</label><textarea id="c-note" placeholder="Sin cebolla, salsa aparte…">' + esc(co.note) + '</textarea>';
  h += '<div style="margin-top:12px"><div class="tot"><span>Subtotal</span><span>' + money(subtotal()) + '</span></div>' + (co.mode === 'DOM' ? '<div class="tot"><span>' + esc(d.label) + '</span><span>' + (d.tbd ? 'por confirmar' : money(d.fee)) + '</span></div>' : '') + '<div class="tot big"><span>Total</span><span>' + money(grand()) + (d.tbd ? ' + envío' : '') + '</span></div></div>';
  h += '<div class="err" id="c-err"></div><div class="row" style="margin-top:12px"><button class="pri sp" id="c-send">Enviar pedido por WhatsApp</button><button class="ghost" id="c-close">Seguir pidiendo</button></div>';
  h += '<div class="hint" style="text-align:center;margin-top:8px">Tu pedido se confirma por WhatsApp. No se cobra nada en esta página.</div>';
  $('cart').innerHTML = h;
  bindCart();
}
function keep() { // lee los campos al vuelo para no perder lo escrito al re-dibujar
  const g = id => $(id) ? $(id).value : null;
  if (g('c-name') != null) co.name = g('c-name'); if (g('c-tel') != null) co.tel = g('c-tel');
  if (g('c-street') != null) co.street = g('c-street'); if (g('c-col2') != null) co.colonia2 = g('c-col2');
  if (g('c-ref') != null) co.ref = g('c-ref'); if (g('c-note') != null) co.note = g('c-note');
  if (g('c-cash') != null) co.cashWith = g('c-cash'); if (g('c-when') != null) co.when = g('c-when');
  if ($('c-link')) co.link = $('c-link').checked;
  persist();
}
function bindCart() {
  const sh = $('cart');
  sh.querySelectorAll('.line button').forEach(b => b.onclick = () => { keep(); const i = +b.dataset.i; if (b.dataset.a === 'p') cart[i].qty++; else { cart[i].qty--; if (cart[i].qty <= 0) cart.splice(i, 1); } persist(); renderBar(); if (!cart.length) { $('ov-cart').classList.remove('show'); return; } renderCart(); });
  sh.querySelectorAll('#c-mode button').forEach(b => b.onclick = () => { keep(); co.mode = b.dataset.m; persist(); renderCart(); });
  sh.querySelectorAll('#c-pay button').forEach(b => b.onclick = () => { keep(); co.pay = b.dataset.p; persist(); renderCart(); });
  if ($('c-col')) $('c-col').onchange = e => { keep(); co.colonia = e.target.value; persist(); renderCart(); };
  if ($('c-link')) $('c-link').onchange = keep;
  if ($('c-geo')) $('c-geo').onclick = () => {
    keep();
    if (!navigator.geolocation) { $('c-err').textContent = 'Tu navegador no permite compartir ubicación.'; return; }
    $('c-geo').textContent = 'Buscando ubicación…';
    navigator.geolocation.getCurrentPosition(p => { co.geo = { lat: Math.round(p.coords.latitude * 1e5) / 1e5, lng: Math.round(p.coords.longitude * 1e5) / 1e5 }; persist(); renderCart(); },
      () => { renderCart(); $('c-err').textContent = 'No pudimos obtener tu ubicación. Escribe tu dirección completa.'; }, { enableHighAccuracy: true, timeout: 12000 });
  };
  if ($('c-copy')) $('c-copy').onclick = () => { try { navigator.clipboard.writeText(CFG.bank.clabe); $('c-copy').textContent = '✓ Copiado'; } catch (e) { $('c-copy').textContent = CFG.bank.clabe; } };
  sh.querySelectorAll('input,textarea,select').forEach(el => { if (el.id !== 'c-col') el.addEventListener('change', keep); });
  $('c-close').onclick = () => { keep(); $('ov-cart').classList.remove('show'); };
  $('c-send').onclick = send;
}
function validate() {
  keep();
  const d = delivery(), err = [];
  if (!cart.length) err.push('Tu pedido está vacío.');
  if (co.name.trim().length < 2) err.push('Escribe tu nombre.');
  if (co.tel.replace(/\D/g, '').length < 10) err.push('Escribe tu teléfono a 10 dígitos.');
  if (co.mode === 'DOM') {
    if (co.street.trim().length < 4) err.push('Escribe tu calle y número.');
    if ((CFG.zones || []).length && !co.colonia) err.push('Elige tu colonia.');
    if (co.colonia === '__otra' && !(co.colonia2 || '').trim()) err.push('Escribe tu colonia.');
    if (!(CFG.zones || []).length && !(co.colonia2 || '').trim()) err.push('Escribe tu colonia.');
    if (d.blocked) err.push('Esa zona queda fuera de nuestra cobertura.');
    if (CFG.minOrder && subtotal() < CFG.minOrder) err.push('El pedido mínimo a domicilio es de ' + money(CFG.minOrder) + '.');
  }
  if (!co.when) err.push('Elige para cuándo lo quieres.');
  if (!co.pay) err.push('Elige tu forma de pago.');
  if (co.pay === 'EFECTIVO' && co.cashWith !== '' && parseFloat(co.cashWith) < grand() && !d.tbd) err.push('El efectivo con el que pagas es menor al total.');
  return err;
}

/* ---------- Mensaje de WhatsApp ---------- */
function b64url(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function whenText(w) { const [d, t] = w.split(' '); const dt = new Date(d + 'T12:00:00'); const today = d === ymd(new Date()); return (today ? 'Hoy' : DOW[dt.getDay()] + ' ' + dt.getDate()) + ' · ' + (t === 'ASAP' ? 'lo antes posible' : t + ' h'); }
function buildOrder() {
  const d = delivery(), id = 'W' + Date.now().toString(36).slice(-5).toUpperCase();
  const col = co.mode === 'DOM' ? (co.colonia && co.colonia !== '__otra' ? co.colonia : (co.colonia2 || '')) : '';
  const map = co.mode === 'DOM' && co.geo ? 'https://maps.google.com/?q=' + co.geo.lat + ',' + co.geo.lng : '';
  const o = { v: 1, id, t: Date.now(), n: co.name.trim(), tel: co.tel.replace(/\D/g, '').slice(-10), m: co.mode, a: co.mode === 'DOM' ? co.street.trim() : '', col, rf: co.mode === 'DOM' ? co.ref.trim() : '', map, km: d.km || null, fee: d.fee, tbd: d.tbd, w: co.when, pay: co.pay, cash: co.pay === 'EFECTIVO' && co.cashWith !== '' ? parseFloat(co.cashWith) : null, link: co.pay === 'TARJETA' && co.link, note: co.note.trim(),
    it: cart.map(i => [i.pid, i.vi, i.qty, i.price, i.name, i.size, i.cat, i.stews, i.flavor]), tot: Math.round(grand() * 100) / 100 };
  let m = '🌮 *PEDIDO EN LÍNEA* ' + id + '\n';
  m += 'Nombre: ' + o.n + '\nTel: ' + o.tel + '\n';
  m += o.m === 'DOM' ? 'Entrega: *A DOMICILIO*\nDirección: ' + o.a + ', ' + o.col + (o.rf ? '\nReferencias: ' + o.rf : '') + (map ? '\nUbicación: ' + map : '') + '\n' : 'Entrega: *RECOGER EN EL LOCAL*\n';
  m += 'Cuándo: ' + whenText(o.w) + '\n';
  m += 'Pago: ' + (o.pay === 'EFECTIVO' ? 'Efectivo' + (o.cash ? ' (paga con ' + money(o.cash) + ')' : '') : o.pay === 'TRANSFERENCIA' ? 'Transferencia (enviaré comprobante)' : 'Tarjeta' + (o.link ? ' — quiero link de pago' : ' — terminal')) + '\n\n';
  cart.forEach(i => { m += '• ' + i.qty + ' x ' + i.name + (showSize(i) ? ' (' + i.size + ')' : '') + (subLines(i).length ? ' — ' + subLines(i).join(', ') : '') + '  ' + money(i.price * i.qty) + '\n'; });
  m += '\nSubtotal: ' + money(subtotal()) + '\n';
  if (o.m === 'DOM') m += (d.tbd ? 'Envío: por confirmar' : d.label + ': ' + money(d.fee)) + '\n';
  m += '*TOTAL: ' + money(o.tot) + (d.tbd ? ' + envío' : '') + '*\n';
  if (o.note) m += 'Notas: ' + o.note + '\n';
  m += '\nCódigo (no lo borres): [[LDS:' + b64url(JSON.stringify(o)) + ']]';
  return { o, m };
}
function send() {
  const err = validate();
  if (err.length) { $('c-err').innerHTML = err.map(esc).join('<br>'); return; }
  const { o, m } = buildOrder();
  const url = 'https://wa.me/52' + CFG.whatsapp.replace(/\D/g, '').slice(-10) + '?text=' + encodeURIComponent(m);
  $('ov-cart').classList.remove('show');
  $('done').innerHTML = '<h3>¡Casi listo! 🎉</h3><p>Se abrirá WhatsApp con tu pedido <b>' + o.id + '</b> ya escrito. <b>Solo presiona enviar</b> para que lo recibamos.</p>' +
    '<p class="hint">Te confirmaremos por WhatsApp' + (o.pay === 'TRANSFERENCIA' ? ' al recibir tu comprobante de transferencia' : '') + '. Total: <b>' + money(o.tot) + (o.tbd ? ' + envío' : '') + '</b></p>' +
    '<a class="pri" id="d-wa" style="display:block;text-align:center;text-decoration:none" href="' + url + '" target="_blank" rel="noopener">Abrir WhatsApp</a>' +
    '<div class="row" style="margin-top:10px"><button class="ghost sp" id="d-copy">Copiar mensaje</button><button class="ghost sp" id="d-new">Hacer otro pedido</button></div>' +
    '<div class="hint" style="margin-top:8px">Si WhatsApp no se abre, copia el mensaje y envíalo al ' + esc(CFG.whatsapp) + '.</div>';
  $('ov-done').classList.add('show');
  $('d-copy').onclick = () => { try { navigator.clipboard.writeText(m); $('d-copy').textContent = '✓ Copiado'; } catch (e) { prompt('Copia tu pedido:', m); } };
  $('d-new').onclick = () => { cart = []; persist(); renderBar(); $('ov-done').classList.remove('show'); };
  window.__lastOrder = { o, m, url };
  try { window.open(url, '_blank'); } catch (e) {}
}

/* ---------- Inicio ---------- */
$('cart-btn').onclick = openCart;
['ov-pick', 'ov-cart', 'ov-done'].forEach(id => $(id).addEventListener('click', e => { if (e.target.id === id) $(id).classList.remove('show'); }));
header(); renderMenu(); renderBar();
</script>
</body>
