<title>Mi Control Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: encabezado con pestañas por módulo; cada módulo es un "anaquel" de renglones con medidor de nivel (cuánto queda) y fecha estimada en que se acaba. */
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --surface-2:#E7ECE5; --ink:#1B2621; --muted:#5C6A63; --line:#D3DBD1;
  --accent:#22604E; --accent-ink:#FFFFFF; --accent-soft:#D9EAE2;
  --ok:#2C7A4C; --ok-soft:#DDF0E3; --warn:#A86200; --warn-soft:#FAEACB; --crit:#B3261E; --crit-soft:#F8DDD9; --info:#3A5A9E; --info-soft:#E0E7F5;
  --m-hogar:#3A5A9E; --m-despensa:#A86200; --m-ocio:#8A3F7A; --m-subs:#22604E;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111614; --surface:#19201D; --surface-2:#222B27; --ink:#E5ECE8; --muted:#97A49D; --line:#2D3833;
  --accent:#6CC3A5; --accent-ink:#0D1914; --accent-soft:#1E3A30;
  --ok:#72CF98; --ok-soft:#1C3426; --warn:#F0B452; --warn-soft:#3A2C13; --crit:#F28B82; --crit-soft:#3D1E1B; --info:#8FB0F0; --info-soft:#1E2840;
  --m-hogar:#8FB0F0; --m-despensa:#F0B452; --m-ocio:#D99BCB; --m-subs:#6CC3A5; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#19201D; --surface-2:#222B27; --ink:#E5ECE8; --muted:#97A49D; --line:#2D3833;
  --accent:#6CC3A5; --accent-ink:#0D1914; --accent-soft:#1E3A30;
  --ok:#72CF98; --ok-soft:#1C3426; --warn:#F0B452; --warn-soft:#3A2C13; --crit:#F28B82; --crit-soft:#3D1E1B; --info:#8FB0F0; --info-soft:#1E2840;
  --m-hogar:#8FB0F0; --m-despensa:#F0B452; --m-ocio:#D99BCB; --m-subs:#6CC3A5; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.65rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.top .sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.today{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}

nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:thin}
nav.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 9px;font:600 .92rem var(--f-body);color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.badge{font:600 .72rem var(--f-mono);background:var(--crit);color:var(--surface);border-radius:20px;padding:1px 6px}

button,.btn{font:600 .85rem var(--f-body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--muted)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.pri:hover{filter:brightness(1.08)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--surface-2)}
button.danger{color:var(--crit)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.banner{background:var(--info-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:.9rem}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .val{font:500 1.5rem var(--f-mono);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:.8rem;color:var(--muted)}
.kpi.crit .val{color:var(--crit)} .kpi.warn .val{color:var(--warn)}

.sec{margin-bottom:26px}
.sec-h{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}

/* Toolbar */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input,.tools select{font:500 .88rem var(--f-body);padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.tools input[type=search]{flex:1 1 200px}
.tools .sp{flex:1}

/* Renglones de inventario */
.shelf{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) minmax(0,1.35fr) 112px auto;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);border-left:4px solid transparent}
.row:first-child{border-top:0}
.row.s-caducado,.row.s-agotado{border-left-color:var(--crit)}
.row.s-reponer,.row.s-porcaducar{border-left-color:var(--warn)}
.row.s-pronto{border-left-color:var(--info)}
.r-name{font-weight:700}
.r-meta{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:2px}
.chip{font-size:.74rem;font-weight:600;background:var(--surface-2);border-radius:5px;padding:1px 7px;color:var(--ink)}
.gauge{height:10px;border-radius:3px;background:var(--surface-2);overflow:hidden;position:relative}
.gauge span{display:block;height:100%;background:var(--ok);border-radius:3px}
.s-reponer .gauge span,.s-porcaducar .gauge span{background:var(--warn)}
.s-agotado .gauge span,.s-caducado .gauge span{background:var(--crit)}
.s-pronto .gauge span{background:var(--info)}
.pips{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.pip{width:10px;height:10px;border-radius:2px;border:1.5px solid var(--muted)}
.r-sub{font-size:.78rem;color:var(--muted);margin-top:3px}
.r-big{font:500 1rem var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.03em;border-radius:20px;padding:3px 9px;text-align:center}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-pronto{background:var(--info-soft);color:var(--info)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-none{background:var(--surface-2);color:var(--muted)}

<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Mi Control Personal</h1>
      <div class="sub">Inventario de la casa, despensa, ocio y suscripciones: qué se acaba, qué vence y qué cobran.</div>
    </div>
    <div style="text-align:right;display:flex;gap:10px;align-items:center;justify-content:flex-end">
      <div><div class="today" id="hoyLbl"></div><div class="sync" id="syncLbl"><i></i><span>Guardado en este dispositivo</span></div></div>
      <button class="m-only" data-tab="config" aria-label="Configuración" style="padding:8px;border-radius:10px"><span class="ico" style="display:block"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span></button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Módulos"></nav>
  <div id="bannerSlot"></div>
  <main id="view"></main>
</div>
<div id="modalSlot"></div>
<div id="toastSlot"></div>

<script>
/* ================== Configuración de módulos ================== */
const MODS = {
  hogar:{nombre:'Hogar', color:'var(--m-hogar)', subs:['Limpieza','Lavandería','Cuidado personal','Baño','Cocina y desechables','Botiquín','Mascotas','Mantenimiento','Otro']},
  despensa:{nombre:'Despensa', color:'var(--m-despensa)', subs:['Abarrotes','Lácteos y huevo','Carnes y pescado','Frutas y verduras','Panadería','Bebidas','Enlatados','Congelados','Botanas y dulces','Condimentos','Otro']},
  ocio:{nombre:'Entretenimiento y Ocio', color:'var(--m-ocio)', subs:['Eventos y boletos','Tarjetas de regalo','Cupones y promociones','Libros y revistas','Juegos y videojuegos','Hobbies y manualidades','Pilas y accesorios','Otro']}
};
const SUBCATS = ['Streaming de video','Música','Nube y software','Gimnasio y deporte','Telefonía e internet','Membresías','Apps y juegos','Noticias y revistas','Educación','Otro'];
const FREQ = {semanal:{n:'Semanal',m:52/12}, mensual:{n:'Mensual',m:1}, bimestral:{n:'Bimestral',m:1/2}, trimestral:{n:'Trimestral',m:1/3}, semestral:{n:'Semestral',m:1/6}, anual:{n:'Anual',m:1/12}};
const USO = {diario:'Diario', semanal:'Cada semana', mensual:'Una vez al mes', casinunca:'Casi nunca'};
const UNIDADES = ['pieza','botella','frasco','paquete','caja','bolsa','lata','rollo','kg','litro','galón','tubo','sobre','boleto','tarjeta'];
const KEY = 'controlPersonal_v1';

/* ================== Fechas y formato ================== */
const pad = n => String(n).padStart(2,'0');
const toS = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const hoy = () => toS(new Date());
const addDays = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+Math.round(n)); return toS(d); };
const diff = (a,b) => Math.round((parseD(b)-parseD(a))/864e5);
function addMonths(s,n){ const d=parseD(s), day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return toS(d); }
function fmtD(s){ if(!s) return '—'; const d=parseD(s); const o={day:'numeric',month:'short'}; if(d.getFullYear()!==new Date().getFullYear()) o.year='numeric'; return d.toLocaleDateString('es-MX',o).replace('.',''); }
function enDias(n){ if(n===0) return 'hoy'; if(n===1) return 'mañana'; if(n===-1) return 'ayer'; return n>0?`en ${n} días`:`hace ${-n} días`; }
const money = v => (Number(v)||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:2});
const money0 = v => (Number(v)||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

/* ================== Estado y almacenamiento ================== */
let S, TAB='resumen', FIL={q:'',sub:'',est:'',orden:'urgencia'};
function base(){ return {items:[],subs:[],compras:[],manual:[],cfg:{alerta:7,alertaSub:5,incluirPronto:true},ejemplo:false}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} programarNube(); }

/* ================== Sincronización en la nube (artifact db) ================== */
let DB=null, refP=null, refC=null, lastP='', lastC='', tNube=null, escribiendo=false, nubeVacia=false, pendRender=false;
const partP = () => ({items:S.items,subs:S.subs,manual:S.manual,cfg:S.cfg,ejemplo:!!S.ejemplo});
const partC = () => ({compras:S.compras.slice(-2000)});
function setSync(est,txt){ const el=document.getElementById('syncLbl'); if(!el) return; el.className='sync '+est; el.querySelector('span').textContent=txt; }
function programarNube(){ if(!DB) return; clearTimeout(tNube); setSync('busy','Guardando…'); tNube=setTimeout(subirNube,700); }
async function subirNube(){
  tNube=null;
  if(!DB) return;
  if(escribiendo){ programarNube(); return; }
  escribiendo=true;
  try{
    const p=partP(), c=partC(), sp=JSON.stringify(p), sc=JSON.stringify(c);
    if(sp!==lastP){ await refP.set(Object.assign({},JSON.parse(sp),{actualizado:new Date().toISOString()})); lastP=sp; }
    if(sc!==lastC){ await refC.set(JSON.parse(sc)); lastC=sc; }
    if(nubeVacia){ nubeVacia=false; render(); }
    setSync('ok','Sincronizado en todos tus dispositivos');
  }catch(e){
    if(e&&e.code==='unavailable'){ escribiendo=false; setTimeout(programarNube,1500+Math.random()*1500); return; }
    setSync('err', e&&e.code==='quota_exceeded'?'Espacio en la nube lleno':'No se pudo guardar en la nube');
  }
  escribiendo=false;
}
function renderSeguro(){ if(document.getElementById('modalSlot').innerHTML){ pendRender=true; return; } const a=document.activeElement; if(a&&a.id==='fq') return; render(); }
async function iniciarNube(){
  let db=null; try{ db=await (window.claude?.use?.('db')); }catch(e){}
  if(!db){ setSync('','Guardado en este dispositivo'); return; }
  DB=db; refP=db.doc('estado/principal'); refC=db.doc('estado/compras');
  setSync('busy','Conectando…');
  refP.onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites) return;
    if(!snap.exists){ nubeVacia=true; setSync('', 'Aún no hay datos en la nube'); render(); return; }
    nubeVacia=false;
    const d=snap.data(); const p={items:d.items||[],subs:d.subs||[],manual:d.manual||[],cfg:Object.assign(base().cfg,d.cfg||{}),ejemplo:!!d.ejemplo};
    const sp=JSON.stringify(p);
    if(sp!==lastP){ lastP=sp; Object.assign(S,JSON.parse(sp)); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} renderSeguro(); }
    if(!tNube&&!escribiendo) setSync('ok','Sincronizado en todos tus dispositivos');
  }, e=>{ setSync('err','Sin conexión con la nube'); });
  refC.onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites) return;
    if(!snap.exists) return;
    const c={compras:snap.data().compras||[]}; const sc=JSON.stringify(c);
    if(sc!==lastC){ lastC=sc; S.compras=JSON.parse(sc).compras; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} renderSeguro(); }
  }, ()=>{});
}
async function guardarArchivo(nombre,texto,tipo){
  let dl=null; try{ dl=await (window.claude?.use?.('downloads')); }catch(e){}
  if(dl){ try{ await dl.save({filename:nombre,data:new Blob([texto],{type:tipo})}); toast('Archivo listo'); }catch(e){ toast('No se guardó el archivo; puedes copiar el texto'); } return; }
  intentarDescarga(nombre,texto,tipo);
}
function load(){
  let raw=null; try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(raw){ try{ S=Object.assign(base(),JSON.parse(raw)); S.cfg=Object.assign(base().cfg,S.cfg); return; }catch(e){} }
  S=ejemplo();
}

function ejemplo(){
  const h=hoy(), a=n=>addDays(h,-n), f=n=>addDays(h,n);
  const it=(mod,nombre,sub,o)=>Object.assign({id:uid(),mod,nombre,sub,unidad:'pieza',precio:0,tienda:'',enUso:true,fechaInicio:null,duracion:null,stock:0,alerta:null,caducidad:'',notas:'',durReales:[]},o);
  const s=base(); s.ejemplo=true;
  s.items=[
    it('hogar','Shampoo','Cuidado personal',{unidad:'botella',precio:89,tienda:'Soriana',fechaInicio:a(35),duracion:45,durReales:[44,47]}),
    it('hogar','Detergente líquido','Lavandería',{unidad:'botella',precio:165,tienda:'Costco',fechaInicio:a(20),duracion:30,stock:1}),
    it('hogar','Papel higiénico 12 rollos','Baño',{unidad:'paquete',precio:118,tienda:'Soriana',fechaInicio:a(12),duracion:14}),
    it('hogar','Pasta dental','Cuidado personal',{unidad:'tubo',precio:42,fechaInicio:a(25),duracion:30,stock:2}),
    it('hogar','Cloro','Limpieza',{unidad:'galón',precio:38,fechaInicio:a(33),duracion:30}),
    it('hogar','Croquetas 4 kg','Mascotas',{unidad:'bolsa',precio:420,tienda:'Petco',fechaInicio:a(10),duracion:28}),
    it('hogar','Paracetamol','Botiquín',{unidad:'caja',precio:55,fechaInicio:a(20),duracion:180,caducidad:f(5)}),
    it('despensa','Café molido','Abarrotes',{unidad:'bolsa',precio:135,fechaInicio:a(15),duracion:20,stock:1}),
    it('despensa','Leche','Lácteos y huevo',{unidad:'litro',precio:28,fechaInicio:a(1),duracion:2,stock:3,caducidad:f(9)}),
    it('despensa','Aceite','Abarrotes',{unidad:'botella',precio:52,fechaInicio:a(38),duracion:40}),
    it('despensa','Arroz','Abarrotes',{unidad:'kg',precio:32,fechaInicio:a(5),duracion:15,stock:1}),

/* ================== Motor de inventario ================== */
const SEV={caducado:0,agotado:1,reponer:2,porcaducar:3,pronto:4,sindato:5,ok:6};
const EST={caducado:['Caducado','p-crit'],agotado:['Agotado','p-crit'],reponer:['Reponer','p-warn'],porcaducar:['Por vencer','p-warn'],pronto:['Pronto','p-pronto'],sindato:['Sin dato','p-none'],ok:['En orden','p-ok']};
function durEf(it){
  const r=(it.durReales||[]).slice(-5);
  if(r.length>=2) return {d:Math.round(r.reduce((a,b)=>a+b,0)/r.length), real:true};
  return {d:Number(it.duracion)||0, real:false};
}
function calc(it){
  const h=hoy(), al=Number(it.alerta)||S.cfg.alerta, {d,real}=durEf(it), stock=Number(it.stock)||0;
  const r={al,dur:d,durReal:real,nivel:0,total:null,fechaAgota:null,fechaComprar:null,estado:'ok',cad:null};
  if(d>0){
    const usado=it.enUso&&it.fechaInicio?diff(it.fechaInicio,h):0;
    const rest=it.enUso?Math.max(0,d-usado):0;
    r.nivel=it.enUso?Math.max(0,Math.min(1,rest/d)):0;
    r.total=rest+stock*d;
    r.fechaAgota=addDays(h,r.total);
    r.fechaComprar=addDays(r.fechaAgota,-al);
    r.estado=r.total<=0?'agotado':r.total<=al?'reponer':r.total<=al*2?'pronto':'ok';
  } else {
    r.estado=(!it.enUso&&stock<=0)?'agotado':(it.caducidad?'ok':'sindato');
    r.nivel=it.enUso||stock>0?1:0;
  }
  if(it.caducidad){
    r.cad=diff(h,it.caducidad);
    const ce=r.cad<0?'caducado':r.cad<=al?'porcaducar':null;
    if(ce && SEV[ce]<SEV[r.estado]) r.estado=ce;
  }
  r.urg=Math.min(r.total??9999, r.cad??9999);
  return r;
}
const necesita = (c) => ['agotado','reponer'].includes(c.estado) || (S.cfg.incluirPronto && c.estado==='pronto');

/* ================== Suscripciones ================== */
function calcSub(s){
  const h=hoy(), al=S.cfg.alertaSub, dias=s.proxCobro?diff(h,s.proxCobro):null;
  const mensual=(Number(s.costo)||0)*(FREQ[s.frecuencia]?.m||1);
  let estado='ok';
  if(s.estado==='cancelada') estado='cancelada';
  else if(s.estado==='pausada') estado='pausada';
  else if(s.finPrueba && diff(h,s.finPrueba)<=al) estado='prueba';
  else if(dias!==null && dias<0) estado='vencida';
  else if(dias!==null && dias<=al) estado='cobro';
  const pocoUso=['casinunca','mensual'].includes(s.uso) && !['cancelada'].includes(s.estado);
  return {dias,mensual,anual:mensual*12,estado,pocoUso};
}
const ESTSUB={ok:['Activa','p-ok'],cobro:['Cobro próximo','p-warn'],vencida:['Pago vencido','p-crit'],prueba:['Termina prueba','p-crit'],pausada:['Pausada','p-none'],cancelada:['Cancelada','p-none']};

function detalleCorto(i,c){
  if(c.estado==='caducado') return `Venció ${fmtD(i.caducidad)} (${enDias(c.cad)})`;
  if(c.estado==='porcaducar') return `Vence ${fmtD(i.caducidad)} (${enDias(c.cad)})`;
  if(c.estado==='agotado') return `Sin existencias${i.tienda?' · '+esc(i.tienda):''}`;
  if(c.fechaAgota) return `Se acaba ~${fmtD(c.fechaAgota)} (${enDias(c.total)})${i.tienda?' · '+esc(i.tienda):''}`;
  return 'Falta indicar cuánto dura';
}

  return `<div class="row s-${c.estado}">

/* ================== Modales ================== */
function modal(html){ document.getElementById('modalSlot').innerHTML=`<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const f=document.querySelector('#ov input:not([type=hidden]),#ov select,#ov textarea'); if(f) f.focus(); }
function cerrar(){ document.getElementById('modalSlot').innerHTML=''; if(pendRender){ pendRender=false; render(); } }
function confirmar(titulo,msg,txt,fn){ modal(`<h2>${titulo}</h2><p>${msg}</p><div class="m-act"><button data-act="cerrar">Cancelar</button><button class="pri" id="okConf">${txt}</button></div>`); document.getElementById('okConf').onclick=()=>{cerrar();fn();}; }
function toast(t){ const s=document.getElementById('toastSlot'); s.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>s.innerHTML='',2600); }
const dl=(id,arr)=>`<datalist id="${id}">${arr.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;

    <label class="f">¿Cuántos días dura uno?<input id="iDur" type="number" min="0" value="${esc(i.duracion||'')}" placeholder="Ej. 45"><span class="help">${(i.durReales||[]).length?`Real registrado: ${i.durReales.slice(-5).join(', ')} días`:'Se ajusta solo con "Terminé uno"'}</span></label>
    <label class="f">Unidades extra guardadas<input id="iStock" type="number" min="0" value="${esc(i.stock)}"><span class="help">Cerradas, sin contar la que usas</span></label>

    <label class="f full">Notas<input id="iNotas" value="${esc(i.notas)}"></label>

  <div class="m-act">${id?`<button class="danger" data-act="delItem" data-id="${id}" style="margin-right:auto">Eliminar</button>`:''}<button data-act="cerrar">Cancelar</button><button class="pri" id="saveItem">Guardar</button></div>`);

    if(o.enUso&&!o.fechaInicio) o.fechaInicio=hoy();

function formCompra(id){
  const i=S.items.find(x=>x.id===id);
  modal(`<h2>Compré: ${esc(i.nombre)}</h2>
  <div class="fg">
    <label class="f">Cantidad<input id="cCant" type="number" min="1" value="1"></label>
    <label class="f">Precio por unidad<input id="cPrecio" type="number" step="0.01" min="0" value="${esc(i.precio||'')}"></label>
    <label class="f full">Nueva caducidad / fecha límite<input id="cCad" type="date" value=""><span class="help">Déjala vacía para conservar ${i.caducidad?fmtD(i.caducidad):'la actual'}.</span></label>
  </div>
  <p class="small muted">${!i.enUso?'Como no tienes uno abierto, se abre uno hoy y el resto va a la reserva.':'Se suman a la reserva.'}</p>
  <div class="m-act"><button data-act="cerrar">Cancelar</button><button class="pri" id="okCompra">Registrar compra</button></div>`);
  document.getElementById('okCompra').onclick=()=>{ registrarCompra(i, Math.max(1,Number(document.getElementById('cCant').value)||1), Number(document.getElementById('cPrecio').value)||0, document.getElementById('cCad').value); cerrar(); render(); toast('Compra registrada'); };
}
function registrarCompra(i,n,precio,cad){
  const cant=n;
  if(precio) i.precio=precio;
  if(cad) i.caducidad=cad;
  if(!i.enUso){ i.enUso=true; i.fechaInicio=hoy(); n-=1; }
  i.stock=(Number(i.stock)||0)+n;
  S.compras.push({id:uid(),fecha:hoy(),mod:i.mod,itemId:i.id,concepto:cant>1?`${i.nombre} x${cant}`:i.nombre,monto:(Number(i.precio)||0)*cant});
  save();
}
function terminar(id){
  const i=S.items.find(x=>x.id===id);
  if(i.enUso&&i.fechaInicio){ const d=diff(i.fechaInicio,hoy()); if(d>=1){ i.durReales=(i.durReales||[]).concat(d).slice(-10); } }
  if((Number(i.stock)||0)>0){ i.stock--; i.enUso=true; i.fechaInicio=hoy(); toast(`Abriste otro ${i.unidad||''}. Quedan ${i.stock} en reserva`); }
  else { i.enUso=false; i.fechaInicio=null; toast(`${i.nombre} se agotó. Ya está en tu lista de compras`); }
  save(); render();
}

function pagar(id){
  const s=S.subs.find(x=>x.id===id);
  S.compras.push({id:uid(),fecha:hoy(),mod:'subs',itemId:s.id,concepto:s.nombre,monto:Number(s.costo)||0});
  const base=s.proxCobro||hoy();
  s.proxCobro = s.frecuencia==='semanal'?addDays(base,7):addMonths(base,{mensual:1,bimestral:2,trimestral:3,semestral:6,anual:12}[s.frecuencia]||1);
  if(s.estado==='prueba'){ s.estado='activa'; s.finPrueba=''; }
  save(); render(); toast(`Pago registrado. Siguiente cobro: ${fmtD(s.proxCobro)}`);
}

/* ================== Respaldo ================== */
function intentarDescarga(nombre,texto,tipo){
  try{ const b=new Blob([texto],{type:tipo}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
}
async function copiar(txt,ta){
  try{ await navigator.clipboard.writeText(txt); toast('Copiado'); }
  catch(e){ if(ta){ ta.focus(); ta.select(); } toast('Selecciona el texto y cópialo con Ctrl+C'); }
}
function exportar(){
  const txt=JSON.stringify(S,null,1), nom=`control_personal_${hoy()}.json`;
  modal(`<h2>Crear respaldo</h2><p class="small muted">Descarga el archivo o copia el texto y guárdalo en un archivo .json. La descarga funciona cuando abres este programa desde tu computadora.</p><textarea class="json" id="jsonOut" readonly>${esc(txt)}</textarea><div class="m-act"><button data-act="cerrar">Cerrar</button><button id="cpJson">Copiar texto</button><button class="pri" id="dlJson">Descargar archivo</button></div>`);
  document.getElementById('dlJson').onclick=()=>guardarArchivo(nom,txt,'application/json');
  document.getElementById('cpJson').onclick=()=>copiar(txt,document.getElementById('jsonOut'));
}
function importar(){
  modal(`<h2>Restaurar respaldo</h2><p class="small muted">Elige tu archivo .json o pega su contenido. Reemplaza todos los datos actuales.</p><input type="file" id="fileIn" accept=".json,application/json"><textarea class="json" id="jsonIn" placeholder="…o pega aquí el contenido del respaldo" style="margin-top:10px"></textarea><div class="m-act"><button data-act="cerrar">Cancelar</button><button class="pri" id="okImp">Restaurar</button></div>`);
  document.getElementById('fileIn').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>document.getElementById('jsonIn').value=r.result; r.readAsText(f); };
  document.getElementById('okImp').onclick=()=>{
    try{ const d=JSON.parse(document.getElementById('jsonIn').value); if(!Array.isArray(d.items)||!Array.isArray(d.subs)) throw 0; S=Object.assign(base(),d); S.cfg=Object.assign(base().cfg,d.cfg); save(); cerrar(); render(); toast('Respaldo restaurado'); }
    catch(e){ toast('El texto no es un respaldo válido de este programa'); }
  };
}
function exportarCSV(){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[['Módulo','Producto','Categoría','Unidad','Precio','Reserva','Días que dura','Se acaba','Comprar antes de','Caducidad','Estado']];
  S.items.forEach(i=>{const c=calc(i);rows.push([MODS[i.mod].nombre,i.nombre,i.sub,i.unidad,i.precio,i.stock,c.dur||'',c.fechaAgota||'',c.fechaComprar||'',i.caducidad||'',EST[c.estado][0]]);});
  S.subs.forEach(s=>{const c=calcSub(s);rows.push(['Suscripciones',s.nombre,s.sub,FREQ[s.frecuencia]?.n,s.costo,'','',s.proxCobro,'',s.finPrueba,ESTSUB[c.estado][0]]);});
  const txt='﻿'+rows.map(r=>r.map(q).join(',')).join('\n');
  modal(`<h2>Inventario en CSV</h2><p class="small muted">Se abre en Excel. Si la descarga no inicia, copia el texto y pégalo en un archivo .csv.</p><textarea class="json" id="csvOut" readonly>${esc(txt.slice(1))}</textarea><div class="m-act"><button data-act="cerrar">Cerrar</button><button id="cpCsv">Copiar texto</button><button class="pri" id="dlCsv">Descargar CSV</button></div>`);
  document.getElementById('dlCsv').onclick=()=>guardarArchivo(`inventario_${hoy()}.csv`,txt,'text/csv;charset=utf-8');
  document.getElementById('cpCsv').onclick=()=>copiar(txt.slice(1),document.getElementById('csvOut'));
}
function verCompras(){
  const arr=S.compras.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const nom={hogar:'Hogar',despensa:'Despensa',ocio:'Ocio',subs:'Suscripciones'};
  modal(`<h2>Historial de compras</h2><div class="list" style="max-height:60vh;overflow-y:auto">${arr.length?arr.map(c=>`<div class="li"><span class="when">${fmtD(c.fecha)}</span><div class="grow"><div class="t">${esc(c.concepto)}</div><div class="d">${nom[c.mod]||''}</div></div><span class="num">${money(c.monto)}</span><button class="ghost" data-act="delCompra" data-id="${c.id}">Quitar</button></div>`).join(''):'<div class="empty">Sin compras registradas.</div>'}</div><div class="m-act"><button data-act="cerrar">Cerrar</button></div>`);
}

/* ================== Eventos ================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]'); if(t){ TAB=t.dataset.tab; FIL={q:'',sub:'',est:'',orden:'urgencia'}; try{localStorage.setItem(KEY+'_tab',TAB);}catch(_){} render(); window.scrollTo({top:0}); return; }
  if(e.target.id==='ov'){ cerrar(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const id=b.dataset.id, a=b.dataset.act;
  if(b.tagName==='INPUT') return;
  switch(a){
    case 'cerrar': cerrar(); break;
    case 'subirNube': lastP=''; lastC=''; programarNube(); break;
    case 'nuevoItem': formItem(null,b.dataset.mod); break;
    case 'editItem': formItem(id); break;
    case 'compre': formCompra(id); break;
    case 'terminar': terminar(id); break;
    case 'delItem': { const i=S.items.find(x=>x.id===id); confirmar('Eliminar producto',`¿Eliminar <b>${esc(i.nombre)}</b> del inventario? Su historial de compras se conserva.`,'Eliminar',()=>{S.items=S.items.filter(x=>x.id!==id);save();render();toast('Producto eliminado');}); break; }
    case 'nuevaSub': formSub(null); break;
    case 'editSub': formSub(id); break;
    case 'pagar': pagar(id); break;
    case 'delSub': { const s=S.subs.find(x=>x.id===id); confirmar('Eliminar suscripción',`¿Eliminar <b>${esc(s.nombre)}</b>? Si solo la diste de baja, mejor cambia su estado a "Cancelada" para conservar el registro.`,'Eliminar',()=>{S.subs=S.subs.filter(x=>x.id!==id);save();render();toast('Suscripción eliminada');}); break; }
    case 'delManual': S.manual=S.manual.filter(x=>x.id!==id); save(); render(); break;
    case 'limpiarManual': S.manual=S.manual.filter(x=>!x.hecho); save(); render(); break;
    case 'copiarLista': {
      const auto=listaAuto(); let txt='Lista de compras '+fmtD(hoy())+'\n';
      Object.keys(MODS).forEach(m=>{const g=auto.filter(x=>x.i.mod===m); if(g.length){ txt+=`\n${MODS[m].nombre}\n`+g.map(x=>`- ${x.i.nombre}${x.i.tienda?' ('+x.i.tienda+')':''}`).join('\n')+'\n'; }});
      const man=S.manual.filter(x=>!x.hecho); if(man.length) txt+='\nOtros\n'+man.map(x=>'- '+x.texto).join('\n')+'\n';
      copiar(txt); break; }
    case 'guardarCfg': S.cfg.alerta=Math.max(1,Number(document.getElementById('cfgAlerta').value)||7); S.cfg.alertaSub=Math.max(1,Number(document.getElementById('cfgAlertaSub').value)||5); S.cfg.incluirPronto=document.getElementById('cfgPronto').checked; save(); render(); toast('Avisos guardados'); break;
    case 'exportar': exportar(); break;
    case 'importar': importar(); break;
    case 'exportarCSV': exportarCSV(); break;
    case 'verCompras': verCompras(); break;
    case 'delCompra': S.compras=S.compras.filter(x=>x.id!==id); save(); verCompras(); render(); break;
    case 'cargarEjemplo': confirmar('Cargar ejemplo','Esto reemplaza tus datos actuales por los de ejemplo. Crea un respaldo antes si quieres conservarlos.','Cargar ejemplo',()=>{S=ejemplo();save();render();}); break;
    case 'borrarTodo': confirmar('Borrar todo','Se eliminan todos tus productos, suscripciones y compras de este navegador. No se puede deshacer.','Borrar todo',()=>{S=base();save();render();toast('Datos borrados');}); break;
    case 'borrarEjemplo': confirmar('Empezar desde cero','Se borran los datos de ejemplo y quedas con el programa vacío para capturar lo tuyo.','Empezar',()=>{S=base();save();render();}); break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='chkItem' && el.checked){ const i=S.items.find(x=>x.id===el.dataset.id); registrarCompra(i,1,Number(i.precio)||0,''); render(); toast(`${i.nombre}: compra registrada`); }
  if(el.dataset.act==='chkManual'){ const m=S.manual.find(x=>x.id===el.dataset.id); m.hecho=el.checked; save(); render(); }
  if(el.id==='fsub'){ FIL.sub=el.value; render(); }
  if(el.id==='fest'){ FIL.est=el.value; render(); }
  if(el.id==='ford'){ FIL.orden=el.value; render(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='fq'){ FIL.q=e.target.value; const pos=e.target.selectionStart; render(); const n=document.getElementById('fq'); n.focus(); n.setSelectionRange(pos,pos); }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='formManual'){ const v=document.getElementById('manualTxt').value.trim(); if(v){ S.manual.push({id:uid(),texto:v,hecho:false}); save(); render(); document.getElementById('manualTxt').focus(); } }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') cerrar(); if(e.key==='Enter' && e.target.closest('#fItem,#fSub')){ e.preventDefault(); (document.getElementById('saveItem')||document.getElementById('saveSub'))?.click(); } });

load();
try{ const t=localStorage.getItem(KEY+'_tab'); if(t) TAB=t; }catch(e){}
render();
iniciarNube();
</script>
</body>
